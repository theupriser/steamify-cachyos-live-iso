# The Steamify ISO's release, step 1 of 2 (GitHub): names it and creates its tag and a release with the notes.
# The Gitea mirror (git.upriser.nl) gets the tag with its next sync (triggered here when GIT_UPRISER_TOKEN is set),
# builds the ISO on that tag and attaches it to its own release for it (iso-2-gitea-build.yml). The ISO lives there:
# GitHub releases take at most 2 GB per file, the ISO is bigger, and a release on the mirror only survives its
# syncs when its tag comes from here.
# Name: the Steamify version the ISO gets (its newest release) plus the time (UTC, GitHub's clock when the release starts):
# kind release: v<steamify>-<YYMMDD>, a real release; kind dev: a pre-release v<steamify>-dev-<YYMMDD> (like CachyOS: the
# day, no time). One ISO per day and kind: the newest build of a day replaces the earlier one. At most 10 dev and 10 real
# releases are kept (the oldest go, here and, with the mirror's next sync, there).
name: ISO 1/2 · Tag and release (GitHub)

# Always run from master. Started by steamify-cachyos (its bundle.yml, secret ISO_DISPATCH_TOKEN), which says what to
# build: a version published from main -> kind release, a version on a release branch -> kind dev. Or by hand (Run
# workflow); `auto` is a release on master and a dev build on any other branch. Not started by pushes.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "release (a real ISO), dev (a pre-release test build) or auto (release on master, dev elsewhere)"
        type: choice
        options: [auto, release, dev]
        default: auto
      steamify_ref:
        description: "Steamify branch or tag to build the ISO with (empty: the newest published release). A release branch tests its own version."
        type: string
        default: ""

permissions:
  contents: write

env:
  GITEA_URL: ${{ secrets.GIT_UPRISER_URL }}
  GITEA_REPO: theupriser/steamify-cachyos-live-iso

jobs:
  tag:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_UPRISER_TOKEN: ${{ secrets.GIT_UPRISER_TOKEN }}
        run: |
          steamify="$(gh release view -R theupriser/steamify-cachyos --json tagName -q .tagName)"
          steamify="${steamify#v}"
          # A branch or tag of Steamify to build with (a release branch before its release), else the newest release.
          sref="${{ inputs.steamify_ref }}"
          if [ -n "$sref" ]; then
            steamify="$(gh api "repos/theupriser/steamify-cachyos/contents/steamify.sh?ref=$sref" -q .content | base64 -d | sed -n 's/^VERSION=//p' | head -n 1)"
            [ -n "$steamify" ] || { echo "::error::no VERSION in steamify.sh at $sref"; exit 1; }
          fi
          stamp="$(date -u +%y%m%d)" day="$(date -u +%Y.%m.%d)"
          kind="${{ inputs.kind }}"
          if [ -z "$kind" ] || [ "$kind" = auto ]; then
            if [ "${{ github.ref }}" = refs/heads/master ]; then kind=release; else kind=dev; fi
          fi
          if [ "$kind" = release ]; then
            tag="v$steamify-$stamp" pre="" name="CachyOS with Steamify Live ISO $steamify ($day UTC)"
          else
            tag="v$steamify-dev-$stamp" pre="--prerelease" name="CachyOS with Steamify Live ISO $steamify (test build $day UTC)"
          fi
          # The ISO's file on the mirror is named after the tag (iso-2-gitea-build.yml, profiledef.sh), so its
          # download link is known now.
          file="steamify-cachyos-${tag#v}-x86_64.iso" dl="$GITEA_URL/$GITEA_REPO/releases/download/$tag"
          # The notes are generated, nothing is written by hand:
          #  - the CachyOS base version (first line of CHANGELOG.md, the fork's upstream changelog),
          #  - the Steamify version's own changelog section (steamify-cachyos CHANGELOG.md at the ref or tag it is built from),
          #  - this repository's commits since the previous release of the same kind.
          base="$(head -n 1 CHANGELOG.md | sed 's/^# *//')"
          steamify_notes="$(gh api "repos/theupriser/steamify-cachyos/contents/CHANGELOG.md?ref=${sref:-v$steamify}" -q .content 2> /dev/null | base64 -d 2> /dev/null |
              awk -v v="$steamify" 'index($0, "## " v " ") == 1 {f = 1; next} f && /^## / {exit} f')"
          [ "$kind" = release ] && want_pre=false || want_pre=true
          [ "$kind" = release ] && kind_name="real release" || kind_name="dev build"
          prev="$(gh release list -L 50 --json tagName,isPrerelease,createdAt -q "[.[] | select(.isPrerelease == $want_pre and .tagName != \"$tag\")] | sort_by(.createdAt) | reverse | .[0].tagName // empty")"
          # Commits that change the ISO itself: not the workflow ones (type or scope ci, e.g. ci: / fix(ci):) and not docs:.
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then
            range="$prev..HEAD"; limit=40; since="Since \`$prev\`:"
          else
            range="HEAD"; limit=12; since="The latest commits (there is no earlier $kind_name to compare with):"
          fi
          changes="$(git log --no-merges --format='%s' "$range" | grep -Ev '^(ci|docs)(\(.*\))?:|^[a-z]+\(ci\):' | sed 's/^/- /' | head -n "$limit" || true)"
          [ -n "$changes" ] || changes="- No changes to the ISO itself."
          notes="![ISO build](https://img.shields.io/badge/ISO_build-running-yellow)

          **CachyOS $base with Steamify $steamify${sref:+ (branch $sref)} built in.** Install CachyOS and turn the PC into a Steam Machine in one go.

          The ISO is built from \`$(git rev-parse --short HEAD)\` (${{ github.ref_name }}). It is about 3 GB, more than a GitHub release can hold (2 GB per file), so it is published on the mirror about 20 minutes after this release is created:

          **Download: [$file]($dl/$file)** ([SHA-256]($dl/$file.sha256), [release page]($GITEA_URL/$GITEA_REPO/releases/tag/$tag))

          ### Steamify $steamify
          ${steamify_notes:-There is no changelog section for this version.}

          ### Changes in this ISO
          $since
          $changes

          ### Sources
          [Steamify](https://github.com/theupriser/steamify-cachyos/tree/${sref:-v$steamify}), this repository at this tag, and the packages' sources at [CachyOS](https://github.com/CachyOS) and [Arch Linux](https://archlinux.org/packages/)."
          # One ISO per day and kind: the newest build of a day replaces the earlier one (space), here and on the mirror.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1 || gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag exists: replacing it"
            gh release delete "$tag" --cleanup-tag -y 2> /dev/null || true
            git push origin ":refs/tags/$tag" 2> /dev/null || true
          fi
          # An annotated tag: its own date, so the mirror sorts releases on the same commit in order (a
          # lightweight tag only has its commit's date).
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$name" "$GITHUB_SHA" && git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag $pre --title "$name" --notes "$notes"
          echo "Released $tag"
          echo "ISO_TAG=$tag" >> "$GITHUB_ENV"
          echo "STEAMIFY_REF=$sref" >> "$GITHUB_ENV"

          # Retention (space): at most 10 dev and 10 real releases; the oldest go, release and tag. The mirror drops the
          # tag with its release and ISO at its next sync (the step below).
          keep=10
          for pre_flag in true false; do
            gh release list -L 200 --json tagName,isPrerelease,createdAt \
                -q "[.[] | select(.isPrerelease == $pre_flag)] | sort_by(.createdAt) | reverse | .[$keep:][] | .tagName" |
              while read -r old; do echo "Retention: removing $old"; gh release delete "$old" --cleanup-tag -y; done
          done

      # The mirror takes the tag (sync), then the build on the mirror is started explicitly (its dispatch API): a tag that
      # is replaced (same name, a new tag object) starts no run there by itself. Needs a Gitea token with repository write
      # access as the secret GIT_UPRISER_TOKEN; without it the mirror picks the tag up later and nothing is built.
      - name: Sync the Gitea mirror and start its build
        env:
          GIT_UPRISER_TOKEN: ${{ secrets.GIT_UPRISER_TOKEN }}
        run: |
          if [ -z "$GIT_UPRISER_TOKEN" ]; then echo "No GIT_UPRISER_TOKEN: the mirror is not synced and no build is started."; exit 0; fi
          api="$GITEA_URL/api/v1/repos/$GITEA_REPO"
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors -X POST -H "Authorization: token $GIT_UPRISER_TOKEN" "$api/mirror-sync"
          echo "Mirror sync started"
          want="$(git rev-parse "refs/tags/$ISO_TAG")"
          for _ in $(seq 60); do
            got="$(curl -s "$api/tags/$ISO_TAG" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2> /dev/null)"
            [ "$got" = "$want" ] && break
            sleep 5
          done
          [ "$got" = "$want" ] || { echo "::error::the mirror does not have $ISO_TAG ($want) after 5 minutes"; exit 1; }
          # ref: the full name (refs/tags/...), as in Gitea's API documentation; --fail-with-body shows the server's reason.
          curl -sS --fail-with-body --retry 3 -X POST -H "Authorization: token $GIT_UPRISER_TOKEN" -H "Content-Type: application/json" \
              -d "{\"ref\":\"refs/tags/$ISO_TAG\",\"inputs\":{\"steamify_ref\":\"$STEAMIFY_REF\"}}" "$api/actions/workflows/iso-2-gitea-build.yml/dispatches"
          echo "Started the mirror's build for $ISO_TAG"
